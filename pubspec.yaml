name: kisan_plant_doctor
description: Offline Plant Disease Detection for Indian Farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  image_picker: ^1.0.7
  image: ^4.1.7
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plant_disease_model.tflite
    - assets/class_names_allplants.json
    - assets/disease_database.json